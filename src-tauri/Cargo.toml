[package]
name = "diurnum"
version = "0.1.3"
description = "Diurnum local-first accounting workspace"
authors = ["Diurnum"]
edition = "2021"

[lib]
name = "diurnum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
thiserror = "1"
# time 0.3.48 breaks trait coherence (E0119) in cookie/tauri-utils; cap until upstream fix
time = "=0.3.47"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
