<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Diurnum — New Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/tokens-diurnum.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: var(--text-base-lh);
    color: var(--color-text);
    background: var(--color-bg-muted);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  /* ─── Page shell ──────────────────────────────────────── */
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--space-16) var(--space-8) var(--space-12);
    position: relative;
  }

  /* Window-controls feel — purely decorative, sits in top-left */
  .traffic {
    position: fixed;
    top: var(--space-4);
    left: var(--space-4);
    display: flex;
    gap: 6px;
  }
  .traffic span {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--color-border-strong);
    opacity: 0.7;
  }

  /* ─── Back link ──────────────────────────────────────── */
  .back {
    position: absolute;
    top: var(--space-12);
    left: var(--space-12);
    appearance: none;
    background: none;
    border: none;
    font: inherit;
    font-size: var(--text-md);
    color: var(--color-text-muted);
    cursor: pointer;
    padding: var(--space-2) var(--space-3);
    margin-left: calc(var(--space-3) * -1);
    border-radius: var(--radius-sm);
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    transition: background var(--duration-fast) var(--easing),
                color var(--duration-fast) var(--easing);
  }
  .back:hover {
    background: var(--color-bg-subtle);
    color: var(--color-text);
  }
  .back:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
  .back svg { display: block; }

  /* ─── Card ───────────────────────────────────────────── */
  .card {
    width: 520px;
    background: var(--color-bg);
    border: var(--border-width) solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-subtle);
    padding: var(--space-10) var(--space-10) var(--space-8);
    display: flex;
    flex-direction: column;
    gap: var(--space-8);
  }

  .card-head {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }
  .card-title {
    font-size: var(--text-xl);
    font-weight: var(--weight-semibold);
    letter-spacing: -0.01em;
    margin: 0;
  }
  .card-sub {
    font-size: var(--text-md);
    color: var(--color-text-muted);
    margin: 0;
  }

  /* ─── Form ───────────────────────────────────────────── */
  .form {
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }
  .label {
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--color-text);
  }
  .hint {
    font-size: var(--text-xs);
    color: var(--color-text-subtle);
  }

  .input {
    font: inherit;
    font-size: var(--text-md);
    color: var(--color-text);
    background: var(--color-bg);
    border: var(--border-width) solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    padding: var(--space-3) var(--space-3);
    height: 36px;
    width: 100%;
    transition: border-color var(--duration-fast) var(--easing),
                box-shadow var(--duration-fast) var(--easing);
  }
  .input:hover { border-color: var(--color-text-subtle); }
  .input:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.12);
  }
  .input.mono { font-family: var(--font-mono); font-size: var(--text-base); }

  /* Path field with Browse button */
  .path-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--space-2);
  }
  .btn-secondary {
    appearance: none;
    font: inherit;
    font-size: var(--text-md);
    font-weight: var(--weight-medium);
    color: var(--color-text);
    background: var(--color-bg);
    border: var(--border-width) solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    padding: 0 var(--space-4);
    height: 36px;
    cursor: pointer;
    transition: background var(--duration-fast) var(--easing),
                border-color var(--duration-fast) var(--easing);
  }
  .btn-secondary:hover {
    background: var(--color-bg-subtle);
    border-color: var(--color-text-subtle);
  }
  .btn-secondary:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  /* ─── Template cards ─────────────────────────────────── */
  .templates {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-2);
  }
  .tpl {
    appearance: none;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    background: var(--color-bg);
    border: var(--border-width) solid var(--color-border);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    min-height: 108px;
    position: relative;
    transition: background var(--duration-fast) var(--easing),
                border-color var(--duration-fast) var(--easing);
  }
  .tpl:hover {
    background: var(--color-bg-subtle);
    border-color: var(--color-border-strong);
  }
  .tpl:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }
  .tpl[aria-pressed="true"] {
    background: var(--color-accent-bg);
    border-color: var(--color-accent);
    box-shadow: inset 0 0 0 1px var(--color-accent);
  }
  .tpl-check {
    position: absolute;
    top: var(--space-3);
    right: var(--space-3);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--color-accent);
    color: #fff;
    display: none;
    place-items: center;
  }
  .tpl[aria-pressed="true"] .tpl-check { display: grid; }
  .tpl-check svg { display: block; }

  .tpl-icon {
    width: 24px;
    height: 24px;
    color: var(--color-text-muted);
  }
  .tpl[aria-pressed="true"] .tpl-icon { color: var(--color-accent); }
  .tpl-icon svg { display: block; width: 100%; height: 100%; }

  .tpl-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: auto;
  }
  .tpl-name {
    font-size: var(--text-md);
    font-weight: var(--weight-semibold);
    color: var(--color-text);
    letter-spacing: -0.005em;
  }
  .tpl-desc {
    font-size: var(--text-xs);
    color: var(--color-text-muted);
    line-height: 1.4;
  }

  /* ─── Currency select ────────────────────────────────── */
  .select-wrap {
    position: relative;
    width: 160px;
  }
  .select {
    font: inherit;
    font-size: var(--text-md);
    color: var(--color-text);
    background: var(--color-bg);
    border: var(--border-width) solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    padding: 0 var(--space-8) 0 var(--space-3);
    height: 36px;
    width: 100%;
    appearance: none;
    cursor: pointer;
    transition: border-color var(--duration-fast) var(--easing);
  }
  .select:hover { border-color: var(--color-text-subtle); }
  .select:focus {
    outline: none;
    border-color: var(--color-accent);
    box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.12);
  }
  .select-chevron {
    position: absolute;
    right: var(--space-3);
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-text-muted);
    pointer-events: none;
  }

  /* ─── Primary action ─────────────────────────────────── */
  .actions {
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  .btn-primary {
    appearance: none;
    font: inherit;
    font-size: var(--text-md);
    font-weight: var(--weight-semibold);
    color: #fff;
    background: var(--color-accent);
    border: var(--border-width) solid var(--color-accent);
    border-radius: var(--radius-sm);
    padding: 0 var(--space-4);
    height: 40px;
    width: 100%;
    cursor: pointer;
    transition: background var(--duration-fast) var(--easing),
                border-color var(--duration-fast) var(--easing),
                transform var(--duration-fast) var(--easing);
  }
  .btn-primary:hover {
    background: #245A42;
    border-color: #245A42;
  }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .footnote {
    text-align: center;
    font-size: var(--text-xs);
    color: var(--color-text-subtle);
    margin: 0;
  }
</style>

<style id="diurnum-reskin">
/* ═══ Diurnum Reskin Patch ═════════════════════════════ */

/* Parchment grain — fixed behind everything */
body::before {
  content:""; position:fixed; inset:0;
  background-image:var(--grain); background-size:180px 180px;
  opacity:0.35; mix-blend-mode:multiply;
  pointer-events:none; z-index:0;
}
/* Raise all content above grain */
.app,.page,.shell { position:relative; z-index:1; }

/* ─── Brand mark — Spectral serif D on lapis ─── */
.brand-mark {
  font-family:var(--font-serif)!important;
  font-size:var(--text-xl)!important;
  font-weight:var(--weight-bold)!important;
  color:var(--color-bg)!important;
  width:24px!important; height:24px!important;
  line-height:1!important;
}
.brand-name {
  font-family:var(--font-serif)!important;
  letter-spacing:0.01em!important;
}

/* ─── Page titles → Spectral serif ─── */
.page-header h1,
.page-header-left h1,
.header h1 {
  font-family:var(--font-serif)!important;
  letter-spacing:0.005em!important;
}
.card-title { font-family:var(--font-serif)!important; letter-spacing:0.005em!important; }
.section-title { font-family:var(--font-serif)!important; letter-spacing:0.005em!important; }
.section-head h2 { font-family:var(--font-serif)!important; letter-spacing:0.005em!important; }

/* ─── Nav — inset 2px lapis rule, not filled bg ─── */
.nav-item {
  padding:0 var(--space-3)!important;
  font-weight:var(--weight-medium)!important;
}
.nav-item.active {
  background:var(--color-bg)!important;
  color:var(--color-accent)!important;
  font-weight:var(--weight-medium)!important;
  box-shadow:inset 2px 0 0 var(--color-accent),inset 0 0 0 1px var(--color-border)!important;
}
.nav-item.active svg { color:var(--color-accent)!important; }

/* Count badge */
.count-badge { font-weight:var(--weight-semibold)!important; }
.nav-item.active .count-badge {
  background:var(--color-accent-bg)!important;
  color:var(--color-accent)!important;
  border-color:transparent!important;
}

/* ─── User avatar — iron-gall ink bg ─── */
.user-avatar {
  background:var(--color-text)!important;
  color:var(--color-bg)!important;
  font-size:var(--text-xs)!important;
  font-weight:var(--weight-semibold)!important;
}

/* ─── Hairline borders — warm + slightly stronger at key edges ─── */
.sidebar { border-right-color:var(--color-border-strong)!important; }
.statusbar { border-top-color:var(--color-border-strong)!important; }

/* ─── Buttons ─── */
.btn-primary { color:var(--color-bg)!important; }
.btn-primary:hover {
  background:var(--color-accent-hover)!important;
  border-color:var(--color-accent-hover)!important;
}
/* New Workspace btn-primary */
.btn-primary.standalone:hover,
button.btn-primary:hover { background:var(--color-accent-hover)!important; border-color:var(--color-accent-hover)!important; }

/* Reject — ghost + oxblood on hover */
.btn-reject:hover {
  background:var(--color-destructive-bg)!important;
  color:var(--color-destructive)!important;
}

/* ─── Tab bar active underline ─── */
.tab.active { border-bottom-color:var(--color-accent)!important; }

/* ─── Selected rows — lapis inset rule ─── */
.tx-row.selected {
  background:var(--color-accent-bg)!important;
  box-shadow:inset 2px 0 0 var(--color-accent)!important;
}
.commit-row.selected {
  background:var(--color-bg-subtle)!important;
  border-left-color:var(--color-accent)!important;
}
.commit-row.selected .commit-hash {
  color:var(--color-accent)!important;
  font-weight:var(--weight-medium)!important;
}
.file-table tbody tr.selected td { background:var(--color-accent-bg)!important; }
.file-table tbody tr.selected td:first-child { box-shadow:inset 2px 0 0 var(--color-accent)!important; }

/* Tree pane active */
.tree-item.active {
  background:var(--color-accent-bg)!important;
  color:var(--color-accent)!important;
  box-shadow:inset 2px 0 0 var(--color-accent)!important;
}
.tree-item.active .folder-icon,
.tree-item.active .file-count { color:var(--color-accent)!important; }

/* Settings subnav active */
.subnav-item.active {
  background:var(--color-accent-bg)!important;
  color:var(--color-accent)!important;
  box-shadow:inset 2px 0 0 var(--color-accent)!important;
}
.subnav-item.active .dot { background:var(--color-accent)!important; }

/* ─── Transfer chip + duplicate badge — ochre ─── */
.chip.transfer,
.badge.dup {
  background:var(--color-highlight-bg)!important;
  color:var(--color-highlight-ink)!important;
}

/* ─── Drop hint banner ─── */
.drop-hint { border-bottom-color:var(--color-accent)!important; }

/* ─── Git diff — Diurnum lapis/oxblood tokens ─── */
.diff-line.add { background:var(--diff-add-bg)!important; }
.diff-line.add .ln,
.diff-line.add .lnr { background:var(--diff-add-gut)!important; color:var(--diff-add-text)!important; }
.diff-line.add .marker { color:var(--diff-add-text)!important; }
.diff-line.del { background:var(--diff-del-bg)!important; }
.diff-line.del .ln,
.diff-line.del .lnr { background:var(--diff-del-gut)!important; color:var(--diff-del-text)!important; }
.diff-line.del .marker { color:var(--diff-del-text)!important; }
.hunk-head { background:var(--diff-hunk-bg)!important; color:var(--diff-hunk-text)!important; }
.diff-hash { background:var(--color-accent-bg)!important; color:var(--color-accent)!important; }
.diff-stat .add { color:var(--diff-add-text)!important; }
.diff-stat .del { color:var(--diff-del-text)!important; }
.diff-stat .bar i.a { background:var(--color-accent-strong)!important; }
.file-head .mini-stat .add { color:var(--diff-add-text)!important; }
.file-head .mini-stat .del { color:var(--diff-del-text)!important; }
.diff-filehead .add { color:var(--diff-add-text)!important; }
.diff-filehead .del { color:var(--diff-del-text)!important; }
/* Token highlights in code */
.code .str { color:var(--color-highlight-ink)!important; }
.code .flag-pending {
  background:var(--color-highlight-bg)!important;
  color:var(--color-highlight-ink)!important;
}
.code .flag-approved {
  background:var(--diff-add-gut)!important;
  color:var(--diff-add-text)!important;
}
/* Commit auto-dot */
.auto-dot {
  background:var(--color-accent-strong)!important;
  box-shadow:0 0 0 3px color-mix(in oklch,var(--color-accent-strong) 22%,transparent)!important;
}
/* Commit prefix */
.commit-prefix { color:var(--color-accent)!important; }
/* Commit auto badge */
.commit-tag.auto { background:var(--color-accent-bg)!important; color:var(--color-accent)!important; }

/* ─── Ledger editor ─── */
.err-tip { background:var(--color-text)!important; color:var(--color-bg)!important; }
.err-tip::before { background:var(--color-text)!important; }
.err-tip code {
  background:rgba(254,252,248,0.12)!important;
  color:var(--color-bg)!important;
  border-color:rgba(254,252,248,0.2)!important;
}

/* ─── Reports ─── */
.bar.expense { background:#C4B89A!important; }
.stat-card.accent {
  background:var(--color-accent-bg)!important;
  border-color:transparent!important;
}
.stat-card.accent .stat-label { color:var(--color-accent)!important; opacity:0.85!important; }
.stat-card.accent .stat-value { color:var(--color-accent)!important; }
.stat-delta.up .delta-num { color:var(--color-accent)!important; }
.stat-delta.up svg { color:var(--color-accent)!important; }
.stat-delta.down .delta-num { color:var(--color-destructive)!important; }
.stat-delta.down svg { color:var(--color-destructive)!important; }
.stmt .net-row td {
  background:var(--color-accent-bg)!important;
  color:var(--color-accent)!important;
}
.legend-swatch.revenue { background:var(--color-accent)!important; }
.legend-swatch.expense { background:#C4B89A!important; }

/* ─── CSV Import ─── */
.step.active {
  background:var(--color-accent-bg)!important;
  color:var(--color-accent)!important;
  font-weight:var(--weight-medium)!important;
}
.step.active .step-num {
  background:var(--color-accent)!important;
  color:var(--color-bg)!important;
}
.step.done .step-num {
  background:var(--color-accent-bg)!important;
  color:var(--color-accent)!important;
}
.preview-table td.mapped { background:rgba(36,59,107,0.03)!important; }
.preview-table tbody td.amt.positive { color:var(--color-accent)!important; }
.badge.new { background:var(--color-accent-bg)!important; color:var(--color-accent)!important; }
.pm-legend .swatch-row { background:var(--color-accent-bg)!important; border-color:var(--color-accent)!important; }
.bb-left .check { color:var(--color-accent)!important; }

/* ─── Documents ─── */
.file-icon.csv {
  background:var(--color-accent-bg)!important;
  color:var(--color-accent)!important;
  border-color:var(--color-accent-bg)!important;
}
.file-meta-tag.linked {
  background:var(--color-accent-bg)!important;
  color:var(--color-accent)!important;
}
.mono-preview .mono-line.header .mono-text {
  background:var(--color-accent-bg)!important;
  color:var(--color-accent)!important;
}

/* ─── Settings ─── */
.adapter-row.default { background:var(--color-accent-bg)!important; }
.default-tag {
  color:var(--color-accent)!important;
  border-color:var(--color-accent)!important;
  background:var(--color-bg)!important;
}
.radio.checked { border-color:var(--color-accent)!important; background:var(--color-accent)!important; }
.status-dot.ok { background:var(--color-accent)!important; }
.disclosure-icon { background:var(--color-accent-bg)!important; color:var(--color-accent)!important; }
.disclosure-foot .never { color:var(--color-destructive)!important; }
.test-result { color:var(--color-accent)!important; }
.status-link { color:var(--color-accent)!important; }

/* ─── New Workspace ─── */
.input:focus, .select:focus {
  border-color:var(--color-accent)!important;
  box-shadow:0 0 0 3px rgba(36,59,107,0.12)!important;
}
.tpl[aria-pressed="true"] {
  background:var(--color-accent-bg)!important;
  border-color:var(--color-accent)!important;
  box-shadow:inset 0 0 0 1px var(--color-accent)!important;
}
.tpl[aria-pressed="true"] .tpl-check {
  display:grid!important;
  background:var(--color-accent)!important;
}
.tpl[aria-pressed="true"] .tpl-icon { color:var(--color-accent)!important; }

/* ─── Command palette ─── */
.row.focused {
  background:var(--color-bg-muted)!important;
  box-shadow:inset 2px 0 0 var(--color-accent)!important;
}
.palette {
  border-color:var(--color-border-strong)!important;
}
</style>
</head>
<body>

<div class="page" data-screen-label="09 New Workspace">

  <div class="traffic" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <a href="Welcome.html" class="back" aria-label="Back to Welcome">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/>
      <path d="M12 19l-7-7 7-7"/>
    </svg>
    <span>Back</span>
  </a>

  <div class="card">

    <div class="card-head">
      <h1 class="card-title">New workspace</h1>
      <p class="card-sub">A workspace is a folder on your machine that holds your books, attachments, and settings.</p>
    </div>

    <form class="form" onsubmit="event.preventDefault();">

      <!-- Workspace name -->
      <div class="field">
        <label class="label" for="ws-name">Workspace name</label>
        <input id="ws-name" class="input" type="text" value="Acme Studio" autocomplete="off" />
      </div>

      <!-- Location -->
      <div class="field">
        <label class="label" for="ws-path">Location</label>
        <div class="path-row">
          <input id="ws-path" class="input mono" type="text" value="/Users/ryan/Finance/AcmeStudio" autocomplete="off" />
          <button type="button" class="btn-secondary">Browse…</button>
        </div>
        <div class="hint">A new folder named <span style="font-family: var(--font-mono);">AcmeStudio</span> will be created here.</div>
      </div>

      <!-- Template -->
      <div class="field">
        <label class="label">Template</label>
        <div class="templates" role="radiogroup" aria-label="Template">

          <button type="button" class="tpl" role="radio" aria-pressed="true" aria-checked="true">
            <div class="tpl-icon" aria-hidden="true">

<script>
  // Template card radio behavior
  document.querySelectorAll('.tpl').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tpl').forEach((b) => {
        b.setAttribute('aria-pressed', 'false');
        b.setAttribute('aria-checked', 'false');
      });
      btn.setAttribute('aria-pressed', 'true');
      btn.setAttribute('aria-checked', 'true');
    });
  });
</script>
